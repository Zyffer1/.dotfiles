# ~/.config/yazi/theme.toml

[manager]
cwd = { fg = "#ffffff" }

# File list
[manager.border]
fg = "#ffffff"

[manager.hovered]
fg = "#000000"
bg = "#ffffff"

[manager.find_keyword]
fg = "#ffffff"
bg = "#333333"

# File types
[filetype]
directory = { fg = "#ffffff" }
file = { fg = "#ffffff" }
symlink = { fg = "#aaaaaa" }

# Status bar
[status]
fg = "#ffffff"
bg = "#000000"

# Preview
[preview]
fg = "#ffffff"
bg = "#000000"

# Tabs
[tab]
active = { fg = "#000000", bg = "#ffffff" }
inactive = { fg = "#ffffff", bg = "#000000" }

# Selection
[selection]
fg = "#000000"
bg = "#ffffff"
