# ------------------------------------------------------------
# plugins
# ------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set-option -g @plugin 'b0o/tmux-autoreload'

# ------------------------------------------------------------
# config
# ------------------------------------------------------------

set -g status-position top
set -g status on
set -g status-left "#S "
set -g status-right "%H:%M:%S %d"
set -g status-interval 1
set -g status-style 'bg=default fg=green'

set -g mouse off

set -g base-index 1
setw -g pane-base-index 1

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g pane-border-lines simple


set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"

# TPM plugin path (explicit, to avoid XDG auto-detection issue)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# ------------------------------------------------------------
# key binds
# ------------------------------------------------------------

unbind r
bind -n M-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# bind-key -r f run-shell "tmux neww ~/me/personal/.dotfiles/scripts/tmux-sessionizer"
bind-key f display-popup -E -w 80% -h 70% "~/me/personal/.dotfiles/scripts/tmux-sessionizer"

# new project creator (overrides default prefix+n = next-window)
bind-key n display-popup -E -w 80% -h 70% "~/me/personal/.dotfiles/scripts/newproj"

unbind d
bind-key D detach-client

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

set -g detach-on-destroy off
set -g exit-empty off

# ------------------------------------------------------------
# TPM
# ------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'
