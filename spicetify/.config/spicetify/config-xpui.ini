[Preprocesses]
disable_sentry     = 1
disable_ui_logging = 1
remove_rtl_rule    = 1
expose_apis        = 1

[AdditionalOptions]
extensions            = default-dynamic.js|Vibrant.min.js
custom_apps           = marketplace|visualizer
sidebar_config        = 0
home_config           = 1
experimental_features = 1

[Patch]
xpui.js_find_8008 = ,(\w+=)32,
xpui.js_repl_8008 = ,${1}28,

[Setting]
spotify_path           = $HOME/.local/share/spotify-launcher/install/usr/share/spotify/
prefs_path             = /home/idk/.config/spotify/prefs
current_theme          = DefaultDynamic
color_scheme           = base
inject_theme_js        = 1
inject_css             = 1
overwrite_assets       = 1
spotify_launch_flags   = 
replace_colors         = 1
check_spicetify_update = 1
always_enable_devtools = 0

